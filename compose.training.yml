name: capstone-training
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: capstone_training
      POSTGRES_USER: capstone_training
      POSTGRES_PASSWORD: local_training_only
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - training_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone_training -d capstone_training"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  training_database:
