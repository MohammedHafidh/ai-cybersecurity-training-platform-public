name: Public snapshot verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r requirements/day27.txt
      - run: python scripts/build_day45_corpus.py --check
      - run: python scripts/package_day56_evaluation.py --check
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8765
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run api:check
        working-directory: frontend
      - name: Verify frontend API integration and Chromium smoke tests, including RAG
        working-directory: frontend
        run: |
          fixture="$(mktemp -d)"
          export DATABASE_URL="sqlite:///$fixture/dashboard.db"
          export FRONTEND_ORIGIN=http://localhost:5173
          export CAPSTONE_OLLAMA_ENABLED=0
          PYTHONPATH=../backend python -m app.persistence.setup_core
          python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8765 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/health
          npm test
          CAPSTONE_DEMO_BACKUP=1 npx playwright test
      - name: Save synthetic demo fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: day55-demo-fallback
          path: |
            frontend/test-results/**/demo-evidence.png
            frontend/test-results/**/demo-evidence.json
          if-no-files-found: error
      - name: Verify the clean PostgreSQL demo, browser trace, and reset
        env:
          DATABASE_URL: postgresql+psycopg://capstone_demo:demo_fixture_only@127.0.0.1:55433/capstone_demo
          PYTHONPATH: backend
        run: |
          cleanup() {
            if [ -n "${pid:-}" ]; then kill "$pid" 2>/dev/null || true; fi
            docker compose -f compose.demo.yml down --volumes
          }
          trap cleanup EXIT
          for pass in 1 2; do
            docker compose -f compose.demo.yml up -d --wait
            python -m app.persistence.setup_core
            python -m uvicorn app.main:app --app-dir backend &
            pid=$!
            curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health/database
            test "$(curl --silent --fail http://127.0.0.1:8000/events)" = '[]'
            test "$(curl --silent --fail http://127.0.0.1:8000/detections)" = '[]'
            python scripts/demo_replay.py
            if [ "$pass" = 1 ]; then
              (
                cd frontend
                VITE_API_BASE_URL=http://127.0.0.1:8000 npm run build
                API_SMOKE_URL=http://127.0.0.1:8000 npx playwright test browser/rag.spec.mjs --grep "learner sees"
              )
            fi
            kill "$pid"
            wait "$pid" || true
            pid=''
            docker compose -f compose.demo.yml down --volumes
          done
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capstone_fixture
          POSTGRES_USER: capstone_fixture
          POSTGRES_PASSWORD: fixture_only
        ports:
          - '5432/tcp'
        options: >-
          --health-cmd "pg_isready -U capstone_fixture -d capstone_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r requirements/day27.txt
      - run: >-
          python -m pytest -q backend/tests/test_core_persistence.py
          backend/tests/test_ingestion_api.py backend/tests/test_detection_service.py
          backend/tests/test_detection_api.py backend/tests/test_day37_backend.py
          backend/tests/test_day38_integration.py
          backend/tests/test_local_explanation.py
          backend/tests/test_day47_rag.py
          backend/tests/test_day52_contract.py
        env:
          CAPSTONE_TEST_DATABASE_URL: postgresql+psycopg://capstone_fixture:fixture_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/capstone_fixture
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
      - run: python -m pip install -r backend/requirements.txt -r requirements/day27.txt -r requirements/day46.txt
      - run: python -c "import faiss, sentence_transformers"
      - run: python -m pytest -q backend/tests/test_day46_retrieval.py backend/tests/test_day47_rag.py
  tag-day55:
    name: Tag the verified integrated system
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '306203fa4893ff002d910ac4056a4472fc085474'
    needs: [verify, postgres, retrieval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish integrated-system
        run: |
          existing="$(git ls-remote origin refs/tags/integrated-system 'refs/tags/integrated-system^{}')"
          if [ -n "$existing" ]; then
            printf '%s\n' "$existing" | grep -F "$GITHUB_SHA"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a integrated-system "$GITHUB_SHA" -m 'Day 55 verified integrated system'
          git push origin refs/tags/integrated-system
  tag-day38:
    name: Tag the verified backend milestone
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == 'd2b59b971f6a5692a3dc743ab44ca539c01bffb3'
    needs: [verify, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish backend-v1
        run: |
          existing="$(git ls-remote origin refs/tags/backend-v1 'refs/tags/backend-v1^{}')"
          if [ -n "$existing" ]; then
            printf '%s\n' "$existing" | grep -F "$GITHUB_SHA"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a backend-v1 "$GITHUB_SHA" -m 'Day 38 verified backend milestone'
          git push origin refs/tags/backend-v1
