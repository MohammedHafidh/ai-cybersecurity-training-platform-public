name: Public snapshot verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r requirements/day27.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capstone_fixture
          POSTGRES_USER: capstone_fixture
          POSTGRES_PASSWORD: fixture_only
        ports:
          - '5432/tcp'
        options: >-
          --health-cmd "pg_isready -U capstone_fixture -d capstone_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests/test_core_persistence.py backend/tests/test_ingestion_api.py
        env:
          CAPSTONE_TEST_DATABASE_URL: postgresql+psycopg://capstone_fixture:fixture_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/capstone_fixture
