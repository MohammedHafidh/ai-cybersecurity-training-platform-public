name: capstone-demo
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: capstone_demo
      POSTGRES_USER: capstone_demo
      POSTGRES_PASSWORD: demo_fixture_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone_demo -d capstone_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
